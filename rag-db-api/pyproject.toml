[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oct7-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx",
    "pypdf",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["rag"]
