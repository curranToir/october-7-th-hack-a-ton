name: oct7-rag

x-vllm: &vllm
  image: vllm/vllm-openai:v0.30.0
  restart: unless-stopped
  ipc: host
  gpus: all
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    - ./nemotron-rerank.jinja:/templates/nemotron-rerank.jinja:ro

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 20

  embed:
    <<: *vllm
    command:
      - nvidia/llama-nemotron-embed-1b-v2
      - --trust-remote-code
      - --served-model-name=nemotron-embed
      - --max-model-len=8192
      - --gpu-memory-utilization=0.08
    ports:
      - "127.0.0.1:8101:8000"
    healthcheck: &vllm-health
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health"]
      interval: 10s
      start_period: 600s
      retries: 6

  rerank:
    <<: *vllm
    command:
      - nvidia/llama-nemotron-rerank-1b-v2
      - --trust-remote-code
      - --chat-template=/templates/nemotron-rerank.jinja
      - --served-model-name=nemotron-rerank
      - --max-model-len=8192
      - --gpu-memory-utilization=0.08
    ports:
      - "127.0.0.1:8102:8000"
    healthcheck: *vllm-health
    # Start after the embedder so the two vLLM memory profiles don't race.
    depends_on:
      embed:
        condition: service_healthy

volumes:
  pgdata:
