[project]
name = "company-brain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.3",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
  "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tooling/tests"]
pythonpath = [".", "infrastructure/deployment/scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
