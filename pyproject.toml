[project]
name = "company-brain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi==0.142.3",
  "httpx==0.28.1",
  "langchain==1.4.3",
  "langchain-openai==1.6.7",
  "langgraph==1.2.14",
  "langgraph-checkpoint-postgres==3.1.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "opentelemetry-api==1.45.1",
  "psycopg[binary,pool]==3.3.6",
  "respan-ai==4.2.3",
  "respan-instrumentation-langchain==0.1.2",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
  "pyyaml==6.0.3",
  "boto3==1.43.109",
  "botocore[crt]==1.43.109",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tooling/tests"]
pythonpath = [".", "infrastructure/deployment/scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
